<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found, Daniel Dutra</title>
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232c5a8c'/%3E%3Ctext x='16' y='21.5' font-family='Helvetica,Arial,sans-serif' font-size='14' font-weight='700' text-anchor='middle' fill='%23fefefa'%3EDD%3C/text%3E%3C/svg%3E"
    />
    <script>
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      } catch {
        // Storage can be blocked; the page then follows the OS theme.
      }
    </script>
    <!-- Pages serves this file at any missing path, so URLs are root-relative. -->
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page">
      <main class="content">
        <h1>Page not found</h1>
        <p class="prose">
          Go to <a href="/"><span translate="no">Daniel</span>’s portfolio</a>.
        </p>
      </main>
    </div>
  </body>
</html>
