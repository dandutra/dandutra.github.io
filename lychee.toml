exclude_path = ["node_modules", ".lighthouseci"]

# LinkedIn answers 999 to bots, so its links can't be checked.
# The site's own URL tests the live deploy, not the PR, and 404s while offline.
exclude = ["^https://www\\.linkedin\\.com/", "^https://dandutra\\.github\\.io/"]

# GitHub and some hosts rate-limit CI runners.
accept = ["200..=299", "429"]

# The README links to the local preview server.
exclude_loopback = true

# 404.html uses root-relative links, which resolve against the repo root.
root_dir = "."
